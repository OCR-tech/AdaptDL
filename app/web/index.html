<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AdaptDL</title>
    <!-- <meta name="viewport" content="width=1200, initial-scale=1.0" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Add favicon -->
    <!-- <link rel="icon" type="image/x-icon" href="img/favicon.ico" /> -->
    <link rel="icon" type="image/x-icon" href="img/icon.png" />
    <!-- Add CSS styles -->
    <link rel="stylesheet" href="css/styles.css" />
    <!-- TensorFlow.js and COCO-SSD -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.18.0/dist/tf.min.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script> -->
    <script src="js/tf.min.js"></script>
    <script src="js/coco_ssd.js"></script>
  </head>

  <body>
    <div class="container" id="container">
      <!-- <h1>AdaptDL</h1> -->

      <!-- create a row with two columns on the same row -->
      <div class="row" style="display: flex">
        <div class="column" style="flex: 1">
          <div class="source-section">
            <span class="source-mode-text" id="source-mode-text">Source</span>
            <label class="switch" for="source-switch">
              <input
                type="checkbox"
                id="source-switch"
                disabled="false"
                onclick="toggleSource()"
              />
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <!-- <div class="column" style="flex: 1">
          <div class="menu-section">
            <span class="menu-mode-text" id="menu-mode-text">Menu</span>
            <label class="switch">
              <input type="checkbox" id="menu-switch" disabled="false" />
              <span class="slider"></span>
            </label>
          </div>
        </div> -->

        <div class="screen-section">
          <span class="screen-mode-text" id="screen-mode-text">Screen</span>
          <label class="switch" for="screen-switch">
            <input type="checkbox" id="screen-switch" disabled="false" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="column" style="flex: 1">
          <div class="theme-section">
            <span class="theme-mode-text" id="theme-mode-text">Theme</span>
            <label class="switch" for="theme-switch">
              <input type="checkbox" id="theme-switch" disabled="false" />
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- include source.html  -->
      <div
        class="group-frame-source"
        id="group-frame-source"
        include-html="pages/source.html"
        style="display: none; padding: 0"
      ></div>

      <div class="status" id="status">Initializing...</div>
      <!-- <div class="status" id="status">Welcome</div> -->
      <!-- <div class="status" id="status">Loading model...</div> -->

      <div class="video-section">
        <div class="video-feed" id="video-feed">
          <span id="video-placeholder">Video</span>
        </div>
      </div>

      <div class="controls-section">
        <button
          onclick="startButton()"
          id="btn-start"
          style="width: 65%; display: inline-block"
          disabled="true"
        >
          Start
        </button>
        <button
          onclick="stopButton()"
          id="btn-stop"
          style="width: 65%; display: none"
          disabled="true"
        >
          Stop
        </button>
        <br />
        <button
          class="button-command"
          onclick="showCommand()"
          id="btn-command"
          style="max-width: 65%"
          disabled="true"
        >
          Command
        </button>
        <button
          class="button-voice"
          onclick="showVoice()"
          id="btn-voice"
          style="max-width: 65%"
          disabled="true"
        >
          Voice
        </button>
        <button
          class="button-settings"
          onclick="showSettings()"
          id="btn-settings"
          style="max-width: 65%"
          disabled="true"
        >
          Settings
        </button>
      </div>

      <!-- include command.html  -->
      <div
        class="group-frame-command"
        id="group-frame-command"
        include-html="pages/command.html"
        style="display: none; padding: 0"
      ></div>

      <!-- include voice.html  -->
      <div
        class="group-frame-voice"
        id="group-frame-voice"
        include-html="pages/voice.html"
        style="display: none; padding: 0"
      ></div>

      <!-- include settings.html  -->
      <div
        class="group-frame-settings"
        id="group-frame-settings"
        include-html="pages/settings.html"
        style="display: none; padding: 0"
      ></div>

      <!-- Links for tutorial and help -->
      <div class="links-section" id="links-section">
        <p>
          <a
            class="btn-link fw-bold"
            id="btn-tutorial"
            style="text-decoration: none; cursor: pointer"
            onclick="showTutorial()"
            >Tutorial</a
          >
          |
          <a
            class="btn-link fw-bold"
            id="btn-help"
            style="text-decoration: none; cursor: pointer"
            onclick="showHelp()"
          >
            Help
          </a>
          <!-- |
          <a
            class="btn-link fw-bold"
            href="https://ocr-tech.github.io/AdaptDL/"
            target="_blank"
            style="text-decoration: none"
            >Web</a
          > -->
        </p>
      </div>

      <!-- Begin tutorial.html include -->
      <div
        class="group-frame-tutorial"
        id="group-frame-tutorial"
        include-html="pages/tutorial.html"
        style="display: none"
      ></div>

      <!-- Begin help.html include -->
      <div
        class="group-frame-help"
        id="group-frame-help"
        include-html="pages/help.html"
        style="display: none"
      ></div>
    </div>

    <div class="footer">
      <!-- &copy; 2025 AdaptDL | Real-Time Object Detection with Voice Commands -->
      <p>
        &copy; 2025

        <a
          class="btn-link fw-bold"
          href="https://ocr-tech.github.io/AdaptDL/"
          target="_blank"
          style="text-decoration: none; color: inherit"
          >AdaptDL</a
        >
        | Real-Time Object Detection
      </p>
    </div>

    <!-- Add JavaScript files -->
    <!-- The script is moved to the end of the body to ensure DOM elements are loaded -->

    <script src="js/init.js"></script>
    <script src="js/source.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/object_detect.js"></script>
    <script src="js/source_selector.js"></script>
    <script src="js/command.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/voice_command.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/settings_sms_alert.js"></script>
    <script src="js/settings_email_alert.js"></script>
    <script src="js/include_html.js"></script>
  </body>
</html>
